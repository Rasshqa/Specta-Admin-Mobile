org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Fix: Kotlin incremental compilation fails on Windows when project and pub cache
# are on different drive letters (E:\ vs C:\). Disabling incremental compilation
# avoids the "this and base files have different roots" IllegalArgumentException.
kotlin.incremental=false
